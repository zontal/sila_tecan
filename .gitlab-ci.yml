image: mcr.microsoft.com/dotnet/sdk:7.0

variables:
  OBJECTS_DIRECTORY: 'obj'
  NUGET_PACKAGES_DIRECTORY: '.nuget'
  SOURCE_CODE_PATH: '*/*/'

cache:
  key: "$CI_JOB_STAGE-$CI_COMMIT_REF_SLUG"
  paths:
    - '$SOURCE_CODE_PATH$OBJECTS_DIRECTORY/project.assets.json'
    - '$SOURCE_CODE_PATH$OBJECTS_DIRECTORY/*.csproj.nuget.*'
    - '$NUGET_PACKAGES_DIRECTORY'
  policy: pull-push

stages:
  - build
  - test
  - interop

build:
  stage: build
  script:
    - 'dotnet restore --packages $NUGET_PACKAGES_DIRECTORY'
    - 'dotnet build --no-restore'

tests:
  stage: test
  allow_failure: true
  script:
    - 'dotnet restore --packages $NUGET_PACKAGES_DIRECTORY'
    - 'dotnet test Tests/DynamicClientTests/DynamicClientTests.csproj --no-restore -f net7.0 --logger "console;verbosity=detailed" --logger "html;logfilename=testResults.html"'
    - 'dotnet test Tests/Features/Authentication.Tests/Authentication.Tests.csproj --no-restore -f net7.0 --logger "console;verbosity=detailed" --logger "html;logfilename=testResults.html"'
    - 'dotnet test Tests/Features/Locking.Tests/Locking.Tests.csproj --no-restore -f net7.0 --logger "console;verbosity=detailed" --logger "html;logfilename=testResults.html"'
    - 'dotnet test Tests/Features/ParameterDefaultsProvider.Tests/ParameterDefaultsProvider.Tests.csproj --no-restore -f net7.0 --logger "console;verbosity=detailed" --logger "html;logfilename=testResults.html"'
    - 'dotnet test Tests/Features/Recovery.Tests/Recovery.Tests.csproj --no-restore -f net7.0 --logger "console;verbosity=detailed" --logger "html;logfilename=testResults.html"'
    - 'dotnet test Tests/Generator.Tests/GeneratorTest.csproj --no-restore -f net7.0 --logger "console;verbosity=detailed" --logger "html;logfilename=testResults.html"'
  artifacts:
    when: always
    paths:
      - "**/testResults.html"

interop_server_managed:
  stage: interop
  allow_failure: true
  script:
    - 'dotnet restore --packages $NUGET_PACKAGES_DIRECTORY'
    - 'dotnet build --no-restore Interoperability/InteropServer.NetCore/InteropServer.NetCore.csproj -f net7.0'
    - 'dotnet Build/Interop/ServerNetCore/net7.0/Tecan.Sila2.Interop.Server.dll > server.log 2>&1 & server_pid=$!'
    - echo "Interop server started"
    - apt-get update
    - apt-get install -yq python3-pip
    - pip install sila2_interop_communication_tester
    - python3 -m sila2_interop_communication_tester.test_client --report-file managed_server7-test-report.xml --testsuite-name "Managed gRPC .NET 7 Server" --html-file managed_server7-test-report.html
    - kill -INT $server_pid
  artifacts:
    when: always
    paths:
      - server.log
      - managed_server7-test-report.xml
      - managed_server7-test-report.html

interop_client_managed:
  stage: interop
  allow_failure: true
  before_script:
    - apt-get update
    - apt-get install -yq python3-pip
    - pip install sila2_interop_communication_tester
  script:
    - python3 -m sila2_interop_communication_tester.test_server --report-file managed_client7-test-report.xml --testsuite-name "Managed gRPC .NET 7 Client" --html-file managed_client7-test-report.html & server_pid=$!
    - sleep 5
    - dotnet build Interoperability/InteropClient.NetCore/InteropClient.NetCore.csproj
    - cd Build/Interop/Client.NetCore/net7.0
    - dotnet InteropClient.NetCore.dll > client.log 2>&1
    - sleep 5
    - kill -INT $server_pid
    - wait $server_pid
  artifacts:
    when: always
    paths:
      - client.log
      - managed_client7-test-report.xml
      - managed_client7-test-report.html

interop_server_unmanaged:
  stage: interop
  allow_failure: true
  script:
    - 'dotnet restore --packages $NUGET_PACKAGES_DIRECTORY'
    - 'dotnet build --no-restore Interoperability/InteropServer/InteropServer.csproj -f net7.0'
    - 'dotnet Build/Interop/Server/net7.0/InteropServer.dll > server.log 2>&1 & server_pid=$!'
    - echo "Interop server started"
    - apt-get update
    - apt-get install -yq python3-pip
    - pip install sila2_interop_communication_tester
    - python3 -m sila2_interop_communication_tester.test_client --report-file unmanaged_server7-test-report.xml --testsuite-name "Unmanaged gRPC .NET 7 Server" --html-file unmanaged_server7-test-report.html
    - kill -INT $server_pid
  artifacts:
    when: always
    paths:
      - server.log
      - unmanaged_server7-test-report.xml
      - unmanaged_server7-test-report.html

interop_client_unmanaged:
  stage: interop
  allow_failure: true
  before_script:
    - apt-get update
    - apt-get install -yq python3-pip
    - pip install sila2_interop_communication_tester
  script:
    - python3 -m sila2_interop_communication_tester.test_server --report-file unmanaged_client7-test-report.xml --testsuite-name "Unmanaged gRPC .NET 7 Client" --html-file unmanaged_client7-test-report.html & server_pid=$!
    - sleep 5
    - dotnet build Interoperability/InteropClient.NetCore/InteropClient.NetCore.csproj
    - cd Build/Interop/Client.NetCore/net7.0
    - dotnet InteropClient.NetCore.dll > client.log 2>&1
    - sleep 5
    - kill -INT $server_pid
    - wait $server_pid
  artifacts:
    when: always
    paths:
      - client.log
      - unmanaged_client7-test-report.xml
      - unmanaged_client7-test-report.html